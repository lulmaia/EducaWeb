<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EducaWeb Admin Login</title>
  <link rel="stylesheet" href="Styles/AdminLogin.css" />
</head>
<body>
  <div class="container">
    <div class="form-container">
      <div class="logo">
        <h1><span>Educa</span>Web</h1>
      </div>
      <h2>Administrador: Entre para Gerenciar os Cursos e Cadastros</h2>
      <p class="welcome-text">Bem-vindo de volta, faça login para se conectar</p>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="robert.langster@gmail.com" required />
        <label for="password">Password</label>
        <div class="password-container">
          <input type="password" id="password" placeholder="********" required />

        </div>
        <div class="remember-container">
          <input type="checkbox" id="rememberMe" />
          <label for="rememberMe">Remember me</label>
        </div>
        <div class="button-container">
          <button type="submit" class="login-btn">Login</button>
        </div>
      </form>
    </div>
    <div class="image-container">
      <img src="./Image/day66travel.png" alt="Van illustration" />
    </div>
  </div>
  <script src="./Js/script.js"></script>
</body>
</html>
